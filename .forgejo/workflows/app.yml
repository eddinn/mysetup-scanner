name: App

# The Go app (docs/app.md) on the homelab's Forgejo and its Linux runner: formatted, vetted for every target, tested, built
# without C for every target and built twice to show the same source gives the same bytes, then run on the runner with its
# report and its page checked. The runner is a container: a run shows the app starts and gives a valid report there, not that
# real hardware reads correctly. The same run on Windows and macOS is GitHub's (.github/workflows/app.yml), which gets every
# push through the mirror. A failed run emails whoever pushed.
on:
  push:
    paths:
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - tests/validate_report.py
      - tools/build-release.sh
      - .forgejo/workflows/app.yml
  pull_request:

enable-email-notifications: true

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: '0'
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Formatted
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vetted for every target
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 freebsd/amd64 openbsd/amd64 netbsd/amd64 illumos/amd64; do
            echo "== $target"
            GOOS=${target%/*} GOARCH=${target#*/} go vet ./...
          done
      - name: Made-up computers
        run: go test -count=1 ./...
      # -buildvcs=false, as the release builds: the bytes depend on the source and Go's version alone, not on the clone's tags or
      # state. Every target the app supports, the ones not published too; built outside the checkout, which the last check keeps
      # clean.
      - name: The same source gives the same bytes, on every system
        run: |
          mkdir -p "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"
          for target in darwin/amd64 darwin/arm64 freebsd/amd64 openbsd/amd64 netbsd/amd64 illumos/amd64; do
            os=${target%/*}; arch=${target#*/}
            GOOS=$os GOARCH=$arch go build -buildvcs=false -trimpath -ldflags='-s -w -buildid=' -o "$RUNNER_TEMP/a/$os-$arch" ./cmd/mysetup-scan
            GOOS=$os GOARCH=$arch go build -buildvcs=false -trimpath -ldflags='-s -w -buildid=' -o "$RUNNER_TEMP/b/$os-$arch" ./cmd/mysetup-scan
            cmp "$RUNNER_TEMP/a/$os-$arch" "$RUNNER_TEMP/b/$os-$arch"
          done
      - name: The release build script, linted
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck tools/build-release.sh
      # The downloads exactly as a release publishes them (tools/build-release.sh, which GitHub's release workflow runs too):
      # Windows and Linux, each built twice and refused if the bytes differ, Linux as its .tar.gz.
      - name: The downloads, as a release builds them
        run: |
          tools/build-release.sh "$RUNNER_TEMP/dist"
          test -z "$(git status --porcelain)"
      # A browser download loses the executable permission; the .tar.gz keeps it. Extracted as a member would, the program is
      # executable, says its version and gives a valid report.
      - name: The Linux download works as extracted
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/scan/hardware.go)
          pre=$(sed -n 's/^const Prerelease = "\(.*\)"$/\1/p' internal/scan/hardware.go)
          mkdir "$RUNNER_TEMP/extract" && cd "$RUNNER_TEMP/extract"
          archive="$RUNNER_TEMP/dist/mysetup-scan-linux-x86-64.tar.gz"
          tar --numeric-owner -tvzf "$archive" | awk '{print $1, $2, $6}' | LC_ALL=C sort > listing.txt
          cat listing.txt
          printf '%s\n' 'drwxr-xr-x 0/0 mysetup-scan-linux-x86-64/' \
            '-rw-r--r-- 0/0 mysetup-scan-linux-x86-64/README.txt' \
            '-rwxr-xr-x 0/0 mysetup-scan-linux-x86-64/mysetup-scan' | LC_ALL=C sort | diff - listing.txt
          tar -xzf "$archive"
          test -x mysetup-scan-linux-x86-64/mysetup-scan
          mysetup-scan-linux-x86-64/mysetup-scan --version | tee version.txt
          grep -q "${version}${pre:+-$pre}" version.txt
          mysetup-scan-linux-x86-64/mysetup-scan --cli > report.txt
          python3 -B "$GITHUB_WORKSPACE/tests/validate_report.py" report.txt
      # Forgejo's own artifact action: GitHub's refuses any server that is not github.com.
      - uses: forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: mysetup-scan-downloads
          path: ${{ runner.temp }}/dist/
          retention-days: 14

  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Made-up computers
        run: go test -count=1 ./...
      - name: This runner
        shell: bash
        run: |
          go build -trimpath -o scan-app.exe ./cmd/mysetup-scan
          ./scan-app.exe --cli > report.txt
          cat report.txt
          python3 -B tests/validate_report.py report.txt || python -B tests/validate_report.py report.txt
      # The page, as a browser uses it, without opening one: served, its download the same report, another site's Done refused,
      # and its own Done ending the app.
      - name: The page on this runner
        shell: bash
        run: |
          ./scan-app.exe --no-browser 2> page.txt &
          app=$!
          url=
          for _ in $(seq 50); do
            url=$(grep -o 'http://127\.0\.0\.1:[0-9]*/t/[0-9a-f]\{64\}/' page.txt | head -n 1 || true)
            [ -n "$url" ] && break
            sleep 0.2
          done
          test -n "$url"
          origin=${url%%/t/*}
          test "$(curl -s -o /dev/null -w '%{http_code}' "$url")" = 200
          curl -s "${url}report.txt" | cmp - report.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://attacker.example' "${url}done")" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Origin: $origin" "${url}done")" = 204
          for _ in $(seq 25); do kill -0 "$app" 2>/dev/null || break; sleep 0.2; done
          if kill -0 "$app" 2>/dev/null; then echo "The app did not end after Done."; kill "$app"; exit 1; fi
          wait "$app"
