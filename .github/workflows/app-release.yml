name: App release

# A tag app-vVERSION (app-v0.1.0-beta.1) drafts a release of the app: each download built twice, refused if the bytes differ, with
# SHA256SUMS and GitHub's attestation that these exact files were built from this repository at that tag. The tag must match the
# app's Version and Prerelease (internal/scan/hardware.go). A tag with a "-" part is a pre-release and never becomes the
# repository's latest release, which stays the scripts'. A person reads the draft and publishes it.
on:
  push:
    tags:
      - 'app-v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: The tag carries the app's version, and its notes exist
        run: |
          version="${GITHUB_REF_NAME#app-v}"
          base="${version%%-*}"
          pre=; case "$version" in *-*) pre="${version#*-}" ;; esac
          grep -qx "const Version = \"${base}\"" internal/scan/hardware.go
          grep -qx "const Prerelease = \"${pre}\"" internal/scan/hardware.go
          test -s "docs/releases/${GITHUB_REF_NAME}.md"
          if [ -n "$pre" ]; then echo "KIND=--prerelease" >> "$GITHUB_ENV"; else echo "KIND=" >> "$GITHUB_ENV"; fi

      # tools/build-release.sh, which the homelab's CI runs for every push too: each download built twice and refused if the bytes
      # differ, Windows as the program, Linux as a .tar.gz whose program is already executable, and SHA256SUMS. -buildvcs=false:
      # the bytes depend on the source and Go's version alone, not on the clone's tags or state, so a shallow clone, a full clone
      # and a source archive all rebuild them (Go 1.24 and later stamp a version from the nearest tag).
      - name: Build each download twice; the bytes must be the same
        run: |
          tools/build-release.sh "$RUNNER_TEMP/dist"
          test -z "$(git status --porcelain)"

      - name: Attest where the files come from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/*

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/* --draft $KIND --latest=false --verify-tag \
            --title "MySetup scan app ${GITHUB_REF_NAME#app-}" --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
