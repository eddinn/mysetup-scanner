name: Scan scripts

# What needs GitHub: the Windows and macOS runs, which the homelab's runner cannot do. The lint, the tests, the run on Linux
# and the runs in eight other distributions' containers are .forgejo/workflows/scripts.yml, on the homelab's own runner;
# GitHub is a mirror of that Forgejo.
on:
  push:
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/scripts.yml
  pull_request:

permissions:
  contents: read

concurrency:
  group: scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint
        shell: powershell
        run: |
          $found = Invoke-ScriptAnalyzer -Path scripts\mysetup-scan.ps1 -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost
          $found | Format-List RuleName, Line, Message
          if ($found) { exit 1 }
      - name: Made-up computer
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_scan_ps1.ps1 -ReportPath "$PWD\made-up.txt"
      - name: Its report
        run: python -B tests/validate_report.py made-up.txt
      - name: This runner, with the member's command
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\mysetup-scan.ps1 | Set-Content -Encoding ascii report.txt
          Get-Content report.txt
      - name: Its report
        run: python -B tests/validate_report.py report.txt

  macos:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Made-up computers
        run: python3 -B tests/test_scan_sh.py
      # A virtual machine, not a real Mac: this shows Apple's tools answer as expected, not real hardware.
      - name: This runner
        run: |
          sh scripts/mysetup-scan.sh > report.txt
          cat report.txt
          python3 -B tests/validate_report.py report.txt
