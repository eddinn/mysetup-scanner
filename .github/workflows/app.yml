name: App

# The Go app (docs/app.md) on GitHub's Windows and macOS runners, which the homelab's Forgejo has none of: tested and run with
# its report and its page checked. Everything else (formatting, vetting and building every target, the same bytes twice, the run
# on Linux) is .forgejo/workflows/app.yml, on the homelab's own runner; GitHub is a mirror of that Forgejo. GitHub's runners are
# virtual machines: a run shows the app starts and gives a valid report there, not that real hardware reads correctly.
on:
  push:
    paths:
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - tests/validate_report.py
      - .github/workflows/app.yml
  pull_request:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: '0'
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Made-up computers
        run: go test -count=1 ./...
      - name: This runner
        shell: bash
        run: |
          go build -trimpath -o scan-app.exe ./cmd/mysetup-scan
          ./scan-app.exe --cli > report.txt
          cat report.txt
          python3 -B tests/validate_report.py report.txt || python -B tests/validate_report.py report.txt
      # The page, as a browser uses it, without opening one: served, its download the same report, another site's Done refused,
      # and its own Done ending the app.
      - name: The page on this runner
        shell: bash
        run: |
          ./scan-app.exe --no-browser 2> page.txt &
          app=$!
          url=
          for _ in $(seq 50); do
            url=$(grep -o 'http://127\.0\.0\.1:[0-9]*/t/[0-9a-f]\{64\}/' page.txt | head -n 1 || true)
            [ -n "$url" ] && break
            sleep 0.2
          done
          test -n "$url"
          origin=${url%%/t/*}
          test "$(curl -s -o /dev/null -w '%{http_code}' "$url")" = 200
          curl -s "${url}report.txt" | cmp - report.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://attacker.example' "${url}done")" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Origin: $origin" "${url}done")" = 204
          for _ in $(seq 25); do kill -0 "$app" 2>/dev/null || break; sleep 0.2; done
          if kill -0 "$app" 2>/dev/null; then echo "The app did not end after Done."; kill "$app"; exit 1; fi
          wait "$app"
