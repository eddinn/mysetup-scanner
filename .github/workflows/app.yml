name: App

# The Go app (docs/app.md): formatted, vetted for every target, tested, built without C for every target, run on Linux, Windows
# and macOS runners with its report checked, and built twice to show the same source gives the same bytes. GitHub's runners are
# virtual machines: a run shows the app starts and prints a valid report there, not that real hardware reads correctly.
on:
  push:
    paths:
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - tests/validate_report.py
      - .github/workflows/app.yml
  pull_request:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: '0'
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Formatted
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vetted for every target
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 freebsd/amd64 openbsd/amd64 netbsd/amd64 illumos/amd64; do
            echo "== $target"
            GOOS=${target%/*} GOARCH=${target#*/} go vet ./...
          done
      - name: Made-up computers
        run: go test -count=1 ./...
      - name: The same source gives the same bytes
        run: |
          mkdir -p a b dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 freebsd/amd64 openbsd/amd64 netbsd/amd64 illumos/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=; [ "$os" = windows ] && ext=.exe
            name=mysetup-scan-$os-$arch$ext
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags='-s -w -buildid=' -o a/$name ./cmd/mysetup-scan
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags='-s -w -buildid=' -o b/$name ./cmd/mysetup-scan
            cmp a/$name b/$name
            cp a/$name dist/
          done
          (cd dist && sha256sum * | tee SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mysetup-scan-stage-1
          path: dist/
          retention-days: 14

  run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Made-up computers
        run: go test -count=1 ./...
      - name: This runner
        shell: bash
        run: |
          go build -trimpath -o scan-app.exe ./cmd/mysetup-scan
          ./scan-app.exe > report.txt
          cat report.txt
          python3 -B tests/validate_report.py report.txt || python -B tests/validate_report.py report.txt
